<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#EEF3FF;--surf:#fff;--surf2:#F4F8FF;--bdr:#E2E8F4;
  --pri:#2563EB;--pri-d:#1D4ED8;--pri-l:#DBEAFE;--pri-ll:#EFF6FF;
  --acc:#F97316;--acc-l:#FFF0E6;
  --ok:#10B981;--ok-l:#ECFDF5;
  --warn:#F59E0B;--warn-l:#FFFBEB;
  --err:#EF4444;--err-l:#FEF2F2;
  --tx:#0F172A;--tx2:#334155;--mu:#64748B;--mu2:#94A3B8;
  --p1b:#FEF2F2;--p1c:#DC2626;
  --p2b:#FFF7ED;--p2c:#EA580C;
  --p3b:#FEFCE8;--p3c:#CA8A04;
  --p4b:#F0FDF4;--p4c:#16A34A;
  --nh:64px;--hh:54px;--r:12px;--r2:8px;--r3:20px;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shm:0 4px 14px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.05);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0A1628;--surf:#132037;--surf2:#1A2C47;--bdr:#1E3055;
  --pri:#3B82F6;--pri-d:#2563EB;--pri-l:#1E3A5F;--pri-ll:#0F2040;
  --acc:#F97316;--acc-l:#3A1F0D;--ok:#10B981;--ok-l:#0D2E21;
  --warn:#F59E0B;--warn-l:#2E2408;--err:#F87171;--err-l:#2E0F0F;
  --tx:#F1F5F9;--tx2:#CBD5E1;--mu:#94A3B8;--mu2:#64748B;
  --p1b:#2E0F0F;--p1c:#F87171;--p2b:#2E1A08;--p2c:#FB923C;
  --p3b:#2E2408;--p3c:#FCD34D;--p4b:#0D2E21;--p4c:#34D399;
  --sh:0 1px 3px rgba(0,0,0,.3);--shm:0 4px 14px rgba(0,0,0,.3);
}}
:root[data-theme=dark]{
  --bg:#0A1628;--surf:#132037;--surf2:#1A2C47;--bdr:#1E3055;
  --pri:#3B82F6;--pri-d:#2563EB;--pri-l:#1E3A5F;--pri-ll:#0F2040;
  --acc:#F97316;--acc-l:#3A1F0D;--ok:#10B981;--ok-l:#0D2E21;
  --warn:#F59E0B;--warn-l:#2E2408;--err:#F87171;--err-l:#2E0F0F;
  --tx:#F1F5F9;--tx2:#CBD5E1;--mu:#94A3B8;--mu2:#64748B;
  --p1b:#2E0F0F;--p1c:#F87171;--p2b:#2E1A08;--p2c:#FB923C;
  --p3b:#2E2408;--p3c:#FCD34D;--p4b:#0D2E21;--p4c:#34D399;
  --sh:0 1px 3px rgba(0,0,0,.3);--shm:0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5}
img{max-width:100%;display:block}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative}
/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--surf);border-bottom:1px solid var(--bdr);padding:0 16px;height:var(--hh);display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:'Poppins',sans-serif;font-weight:800;font-size:19px;color:var(--pri);display:flex;align-items:center;gap:5px}
.lang-sel{padding:5px 8px;border-radius:var(--r2);border:1.5px solid var(--bdr);background:var(--surf2);color:var(--tx);font-size:12px;font-weight:600;outline:none;cursor:pointer}
/* Main */
.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nh)+env(safe-area-inset-bottom,0px))}
/* Nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nh)+env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surf);border-top:1px solid var(--bdr);display:flex;align-items:flex-start;padding-top:6px;z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 1px;color:var(--mu2);font-size:8px;font-weight:600;transition:color .15s;min-width:0}
.nb.on{color:var(--pri)}
.nb .ni{font-size:18px;line-height:1}
/* Views */
.vw{display:none}.vw.on{display:block}
/* Cards */
.card{background:var(--surf);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--bdr);overflow:hidden}
/* Btn */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:var(--r2);font-weight:600;font-size:14px;cursor:pointer;border:none;transition:opacity .15s,transform .1s;font-family:inherit}
.btn:active{transform:scale(.97);opacity:.85}
.btn-p{background:var(--pri);color:#fff}
.btn-o{background:transparent;border:1.5px solid var(--bdr);color:var(--tx)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-bl{width:100%}
/* Badge */
.bdg{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:700;white-space:nowrap}
.p1{background:var(--p1b);color:var(--p1c)}
.p2{background:var(--p2b);color:var(--p2c)}
.p3{background:var(--p3b);color:var(--p3c)}
.p4{background:var(--p4b);color:var(--p4c)}
/* Section */
.sec{padding:16px 16px 0}
.stl{font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
/* Progress */
.pgw{background:var(--bdr);border-radius:100px;height:6px;overflow:hidden}
.pgb{height:100%;background:var(--pri);border-radius:100px;transition:width .4s ease}
/* ===== HOME ===== */
.hero{background:linear-gradient(135deg,#1D4ED8 0%,#7C3AED 100%);color:#fff;padding:22px 16px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-30px;width:180px;height:180px;background:rgba(255,255,255,.06);border-radius:50%}
.hero-date{font-size:11px;opacity:.7;margin-bottom:3px}
.hero-title{font-family:'Poppins',sans-serif;font-size:22px;font-weight:800;line-height:1.2;margin-bottom:6px}
.hero-sub{font-size:13px;opacity:.8}
.trip-card{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:var(--r);padding:14px;margin-top:14px}
.tc-lbl{font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.tc-dest{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700}
.tc-dates{font-size:12px;opacity:.75;margin-top:2px}
.tc-empty{background:rgba(255,255,255,.08);border:1.5px dashed rgba(255,255,255,.3);border-radius:var(--r);padding:14px;margin-top:14px;text-align:center;font-size:13px;opacity:.8;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}
.sc{background:var(--surf);border-radius:var(--r);padding:14px;border:1px solid var(--bdr);box-shadow:var(--sh)}
.sv{font-family:'Poppins',sans-serif;font-size:24px;font-weight:800;color:var(--pri)}
.sl{font-size:12px;color:var(--mu);margin-top:2px}
.si{font-size:22px;margin-bottom:4px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 16px}
.qb{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;background:var(--surf);border-radius:var(--r);border:1px solid var(--bdr);font-size:11px;font-weight:600;color:var(--tx2);cursor:pointer;transition:transform .1s;box-shadow:var(--sh)}
.qb:active{transform:scale(.95)}
.qi{font-size:24px}
/* ===== CHECKLIST ===== */
.clhdr{padding:12px 16px;background:var(--surf);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:10}
.clprow{display:flex;align-items:center;gap:10px;margin-top:8px}
.clpcnt{font-size:13px;font-weight:700;color:var(--pri);white-space:nowrap}
.filter-row{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.fc{padding:5px 12px;border-radius:100px;font-size:12px;font-weight:600;border:1.5px solid var(--bdr);background:var(--surf);color:var(--mu);cursor:pointer;white-space:nowrap;transition:all .15s}
.fc.on{background:var(--pri);border-color:var(--pri);color:#fff}
.cll{padding:0 16px 12px;display:flex;flex-direction:column;gap:8px}
.ci{background:var(--surf);border-radius:var(--r);border:1px solid var(--bdr);box-shadow:var(--sh);overflow:hidden;transition:opacity .2s}
.ci.done{opacity:.55}
.ci.done .ci-t{text-decoration:line-through;color:var(--mu)}
.ci-m{display:flex;align-items:flex-start;gap:10px;padding:13px}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s;margin-top:2px;background:var(--bg)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.ci-ic{font-size:20px;flex-shrink:0;margin-top:1px}
.ci-body{flex:1;min-width:0}
.ci-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ci-t{font-weight:600;font-size:14px;line-height:1.3}
.ci-s{font-size:12px;color:var(--mu);margin-top:3px;line-height:1.4}
.ci-links{border-top:1px solid var(--bdr);padding:9px 13px;display:flex;flex-wrap:wrap;gap:6px;background:var(--surf2)}
.cl{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:100px;background:var(--pri-l);color:var(--pri);font-size:11px;font-weight:700;border:1px solid rgba(37,99,235,.15);cursor:pointer}
.cl:hover{background:var(--pri);color:#fff}
.note-area{padding:0 13px 10px;font-size:12px;color:var(--mu);background:var(--surf2);line-height:1.5}
/* ===== WALLET ===== */
.wstack{padding:16px;display:flex;flex-direction:column;gap:12px}
.wc{position:relative;border-radius:20px;padding:20px;min-height:136px;overflow:hidden;box-shadow:var(--shm);cursor:pointer;transition:transform .2s}
.wc:active{transform:scale(.98)}
.wc.passport{background:linear-gradient(135deg,#0F4C75,#1B6CA8)}
.wc.flight{background:linear-gradient(135deg,#1a1a2e,#16213e)}
.wc.hotel{background:linear-gradient(135deg,#6B2D6B,#A8508A)}
.wc.car{background:linear-gradient(135deg,#1A3A1A,#2D6A2D)}
.wc.insurance{background:linear-gradient(135deg,#3D1F00,#7A3F00)}
.wc.visa{background:linear-gradient(135deg,#1A0030,#4A0080)}
.wc.other{background:linear-gradient(135deg,#2A2A2A,#4A4A4A)}
.wc-bg{position:absolute;top:-25px;right:-25px;width:130px;height:130px;background:rgba(255,255,255,.06);border-radius:50%}
.wc-bg2{position:absolute;bottom:-30px;left:20px;width:80px;height:80px;background:rgba(255,255,255,.04);border-radius:50%}
.wc-type{font-size:10px;color:rgba(255,255,255,.6);font-weight:700;text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;gap:5px;margin-bottom:6px}
.wc-name{font-family:'Poppins',sans-serif;font-size:20px;font-weight:700;color:#fff;margin-bottom:3px}
.wc-sub{font-size:12px;color:rgba(255,255,255,.7)}
.wc-exp{position:absolute;bottom:16px;right:16px;text-align:right}
.wc-el{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em}
.wc-ev{font-size:13px;font-weight:700;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums}
.wc-icon{position:absolute;bottom:14px;left:18px;font-size:28px;opacity:.35}
.wadd{margin:0 16px 16px;padding:16px;border:2px dashed var(--bdr);border-radius:20px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mu);font-size:14px;font-weight:600;cursor:pointer;background:var(--surf);transition:all .2s}
.wadd:hover{border-color:var(--pri);color:var(--pri)}
/* ===== DISCOVER ===== */
.cpicker-wrap{padding:0 16px 8px;position:relative}
.cpicker-btn{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surf);border:2px solid var(--bdr);border-radius:var(--r);cursor:pointer;transition:border-color .15s;text-align:left;font-family:inherit}
.cpicker-btn:hover{border-color:var(--pri-d)}
.cpicker-btn.open{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.cpicker-flag{font-size:26px;line-height:1;flex-shrink:0}
.cpicker-name{flex:1;font-weight:600;font-size:15px;color:var(--tx)}
.cpicker-placeholder{flex:1;font-weight:500;font-size:14px;color:var(--mu)}
.cpicker-arrow{color:var(--mu);font-size:11px;transition:transform .2s;flex-shrink:0}
.cpicker-btn.open .cpicker-arrow{transform:rotate(180deg)}
.cpicker-list{display:none;position:absolute;top:calc(100% - 4px);left:16px;right:16px;background:var(--surf);border:1.5px solid var(--pri);border-radius:var(--r);box-shadow:var(--shm);z-index:50;overflow:hidden;max-height:300px;overflow-y:auto}
.cpicker-list.open{display:block}
.cpicker-item{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;transition:background .1s;border-bottom:1px solid var(--bdr)}
.cpicker-item:last-child{border-bottom:none}
.cpicker-item:hover{background:var(--surf2)}
.cpicker-item.on{background:var(--pri-ll)}
.cpicker-item.on .cpicker-iname{color:var(--pri);font-weight:700}
.cpicker-iflag{font-size:22px;flex-shrink:0}
.cpicker-iname{font-size:14px;font-weight:500;flex:1}
.cpicker-check{color:var(--pri);font-size:14px;font-weight:700}
.dtabs{display:flex;background:var(--surf2);border-radius:var(--r2);padding:3px;gap:2px;border:1px solid var(--bdr)}
.dtab{flex:1;padding:7px 4px;border-radius:6px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;color:var(--mu);transition:all .15s;border:none;background:none;font-family:inherit}
.dtab.on{background:var(--surf);color:var(--pri);box-shadow:var(--sh)}
.dsec{display:none}.dsec.on{display:block}
.ri{display:flex;gap:12px;padding:12px;background:var(--surf);border-radius:var(--r);border:1px solid var(--bdr);margin-bottom:8px}
.ric{font-size:32px;flex-shrink:0}
.riy{flex:1;min-width:0}
.rin{font-weight:600;font-size:14px}
.rid{font-size:12px;color:var(--mu);margin-top:2px;line-height:1.4}
.ritags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.rt{font-size:10px;padding:2px 7px;border-radius:100px;background:var(--pri-l);color:var(--pri);font-weight:700}
.disc-detail{padding:0 16px 16px}
/* ===== SETTINGS ===== */
.slist{padding:16px;display:flex;flex-direction:column;gap:8px}
.sit{display:flex;align-items:center;justify-content:space-between;padding:14px;background:var(--surf);border-radius:var(--r);border:1px solid var(--bdr);gap:12px}
.sil{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.sic{font-size:20px;flex-shrink:0}
.silbl{font-weight:600;font-size:14px}
.sisub{font-size:12px;color:var(--mu);margin-top:1px}
.langrow{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.lb{padding:5px 10px;border-radius:100px;font-size:12px;font-weight:700;border:2px solid var(--bdr);background:var(--surf);color:var(--tx);cursor:pointer;transition:all .15s}
.lb.on{border-color:var(--pri);background:var(--pri);color:#fff}
/* ===== MODALS ===== */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.ov.open{display:flex}
.mo{background:var(--surf);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.mh{width:36px;height:4px;background:var(--bdr);border-radius:100px;margin:-8px auto 16px}
.mt{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px}
.fg{margin-bottom:12px}
.fl{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:5px}
.fi,.fsl,.fta{width:100%;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:var(--r2);background:var(--bg);color:var(--tx);font-size:14px;outline:none;transition:border-color .15s;font-family:inherit}
.fi:focus,.fsl:focus,.fta:focus{border-color:var(--pri)}
.fta{resize:vertical;min-height:70px}
/* Toast */
.toast{position:fixed;bottom:calc(var(--nh)+16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--surf);padding:10px 18px;border-radius:100px;font-size:13px;font-weight:600;opacity:0;transition:all .3s ease;pointer-events:none;white-space:nowrap;z-index:1100;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* File upload zone */
.fuz{border:2px dashed var(--bdr);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;color:var(--mu);font-size:13px;transition:all .2s;background:var(--bg)}
.fuz:hover{border-color:var(--pri);color:var(--pri)}
.img-prev{width:100%;border-radius:var(--r);max-height:160px;object-fit:cover;border:1px solid var(--bdr)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;gap:6px}
.empty-ic{font-size:48px}
.empty-t{font-size:15px;font-weight:700}
.empty-s{font-size:13px;color:var(--mu)}
.wc-del{position:absolute;top:12px;right:14px;background:rgba(255,255,255,.18);border:none;border-radius:100px;padding:3px 8px;font-size:11px;color:rgba(255,255,255,.8);cursor:pointer;font-weight:700;z-index:2}
.wc-del:hover{background:rgba(239,68,68,.5);color:#fff}
/* Rating stars */
.stars{display:flex;gap:2px;margin-top:4px}
.star{font-size:14px;cursor:pointer;opacity:.35;transition:opacity .15s}
.star.on{opacity:1}
/* OCR indicator */
.ocr-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--ok-l);color:var(--ok);border-radius:100px;font-size:11px;font-weight:700;margin-top:6px}
/* ===== WEATHER WIDGET ===== */
.wx{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:var(--r);padding:12px 14px;margin-top:10px}
.wx-ic{font-size:32px;line-height:1;flex-shrink:0}
.wx-main{flex:1}
.wx-temp{font-family:'Poppins',sans-serif;font-size:20px;font-weight:700;color:#fff}
.wx-desc{font-size:12px;color:rgba(255,255,255,.75);margin-top:1px}
.wx-forecast{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 2px;scrollbar-width:none}
.wx-forecast::-webkit-scrollbar{display:none}
.wx-day{flex:0 0 54px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:var(--r2);padding:7px 4px;text-align:center;font-size:10px;color:rgba(255,255,255,.8)}
.wx-day-ic{font-size:18px;margin:3px 0}
.wx-day-t{font-weight:700;font-size:11px;color:#fff}
/* ===== VISITED COUNTRIES ===== */
.vc-row{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surf2);border-top:1px solid var(--bdr);border-bottom:1px solid var(--bdr);cursor:pointer}
.vc-flags{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.vc-flag{font-size:18px;line-height:1}
.vc-cnt{font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;color:var(--pri);white-space:nowrap}
/* ===== MAP VIEW ===== */
.map-toolbar{display:flex;gap:8px;padding:10px 12px;background:var(--surf);border-bottom:1px solid var(--bdr);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:20}
.map-toolbar::-webkit-scrollbar{display:none}
.mtb{padding:6px 14px;border-radius:100px;font-size:12px;font-weight:600;border:1.5px solid var(--bdr);background:var(--surf2);color:var(--tx);cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit}
.mtb.on{background:var(--pri);border-color:var(--pri);color:#fff}
#map-container{height:calc(100dvh - 54px - 64px - 50px);min-height:300px;background:var(--surf2)}
.map-markers{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.mk{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surf);border-radius:var(--r);border:1px solid var(--bdr);box-shadow:var(--sh);cursor:pointer;transition:transform .1s}
.mk:active{transform:scale(.98)}
.mk-ic{font-size:22px;flex-shrink:0}
.mk-body{flex:1;min-width:0}
.mk-name{font-weight:600;font-size:14px}
.mk-coord{font-size:11px;color:var(--mu);margin-top:1px;font-variant-numeric:tabular-nums}
.mk-del{color:var(--err);font-size:18px;padding:4px;opacity:.6;flex-shrink:0}
/* ===== JOURNAL VIEW ===== */
.jnl-add{margin:12px 16px;padding:14px;background:var(--surf);border:2px dashed var(--bdr);border-radius:var(--r);display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--mu);font-size:14px;font-weight:600;transition:all .2s}
.jnl-add:hover{border-color:var(--pri);color:var(--pri)}
.je{background:var(--surf);border-radius:var(--r);border:1px solid var(--bdr);box-shadow:var(--sh);margin:0 16px 10px;overflow:hidden}
.je-hdr{padding:12px 14px 6px;display:flex;align-items:flex-start;gap:8px}
.je-mood{font-size:24px;flex-shrink:0}
.je-meta{flex:1}
.je-date{font-size:11px;color:var(--mu);font-variant-numeric:tabular-nums}
.je-title{font-weight:700;font-size:14px;margin-top:1px;line-height:1.3}
.je-body{padding:0 14px 12px;font-size:13px;color:var(--tx2);line-height:1.6}
.je-img{width:100%;max-height:180px;object-fit:cover}
.je-del{color:var(--err);font-size:16px;padding:2px 6px;opacity:.5;cursor:pointer}
.mood-row{display:flex;gap:8px;flex-wrap:wrap}
.mood-btn{font-size:22px;padding:6px 10px;border-radius:var(--r2);border:2px solid var(--bdr);background:var(--surf2);cursor:pointer;transition:all .15s}
.mood-btn.on{border-color:var(--pri);background:var(--pri-l);transform:scale(1.1)}
/* ===== PACKING CATEGORIES ===== */
.pk-cat{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.pk-cat::-webkit-scrollbar{display:none}
.pc{padding:5px 12px;border-radius:100px;font-size:12px;font-weight:600;border:1.5px solid var(--bdr);background:var(--surf);color:var(--mu);cursor:pointer;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:4px}
.pc.on{background:var(--pri);border-color:var(--pri);color:#fff}
/* Gear btn in header */
.hdr-gear{background:none;border:none;font-size:20px;padding:4px;cursor:pointer;color:var(--mu);border-radius:var(--r2);transition:color .15s}
.hdr-gear:hover{color:var(--pri)}
</style>

</head>
<body>
<div id="app">
  <header class="hdr">
    <div class="logo">✈️ TripGO</div>
    <div style="display:flex;align-items:center;gap:8px">
      <select class="lang-sel" id="lsel" onchange="setLang(this.value)">
        <option value="ko">🇰🇷 한국어</option>
        <option value="en">🇺🇸 EN</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="zh">🇨🇳 中文</option>
      </select>
      <button class="hdr-gear" onclick="navigate('settings')" title="Settings">⚙️</button>
    </div>
  </header>

  <main class="main" id="main">
    <!-- HOME -->
    <div class="vw on" id="vw-home">
      <div class="hero">
        <div class="hero-date" id="h-date"></div>
        <div class="hero-title" id="h-title"></div>
        <div class="hero-sub" id="h-sub"></div>
        <div id="trip-display"></div>
        <div id="wx-widget" style="display:none">
          <div class="wx">
            <div class="wx-ic" id="wx-ic">⛅</div>
            <div class="wx-main">
              <div class="wx-temp" id="wx-temp">--°C</div>
              <div class="wx-desc" id="wx-desc"></div>
            </div>
          </div>
          <div class="wx-forecast" id="wx-forecast"></div>
        </div>
      </div>
      <div class="vc-row" id="vc-row" onclick="navigate('discover')" style="display:none">
        <div class="vc-flags" id="vc-flags"></div>
        <div class="vc-cnt" id="vc-cnt"></div>
      </div>
      <div class="stats" id="stats-row"></div>
      <div class="sec"><div class="stl" id="qa-title"></div></div>
      <div class="qa" id="qa-row"></div>
      <div class="sec"><div class="stl" id="recent-title"></div>
        <div id="recent-list" style="padding-bottom:16px"></div>
      </div>
    </div>

    <!-- CHECKLIST -->
    <div class="vw" id="vw-checklist">
      <div class="clhdr">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="font-family:'Poppins',sans-serif;font-weight:700;font-size:16px" id="cl-hdr-title"></div>
          <button class="btn btn-sm btn-p" onclick="openAddCheckItem()" id="cl-add-btn"></button>
        </div>
        <div class="clprow">
          <div class="pgw" style="flex:1"><div class="pgb" id="cl-pgb" style="width:0%"></div></div>
          <div class="clpcnt" id="cl-cnt"></div>
        </div>
      </div>
      <div class="pk-cat" id="pk-cat-row"></div>
      <div class="filter-row" id="cl-filters"></div>
      <div class="cll" id="cl-list"></div>
    </div>

    <!-- MAP -->
    <div class="vw" id="vw-map">
      <div class="map-toolbar" id="map-toolbar"></div>
      <div id="map-container"></div>
      <div class="map-markers" id="map-markers-list"></div>
    </div>

    <!-- JOURNAL -->
    <div class="vw" id="vw-journal">
      <div class="sec" style="padding-bottom:6px">
        <div class="stl" id="jnl-title"></div>
        <div style="font-size:12px;color:var(--mu)" id="jnl-sub"></div>
      </div>
      <div class="jnl-add" id="jnl-add-btn" onclick="openAddJournal()">
        <span style="font-size:22px">✏️</span><span id="jnl-add-lbl"></span>
      </div>
      <div id="jnl-list"></div>
    </div>

    <!-- WALLET -->
    <div class="vw" id="vw-wallet">
      <div class="sec" style="padding-bottom:12px">
        <div class="stl" id="wl-title"></div>
        <div style="font-size:12px;color:var(--mu)" id="wl-sub"></div>
      </div>
      <div class="wstack" id="wl-stack"></div>
      <div class="wadd" id="wadd-btn" onclick="openAddDoc()">
        <span style="font-size:20px">＋</span><span id="wadd-lbl"></span>
      </div>
    </div>

    <!-- DISCOVER -->
    <div class="vw" id="vw-discover">
      <div class="sec" style="padding-bottom:8px">
        <div class="stl" id="dc-title"></div>
        <div style="font-size:13px;color:var(--mu);margin-bottom:12px" id="dc-sub"></div>
      </div>
      <div class="cpicker-wrap" id="cpicker-wrap"></div>
      <div class="disc-detail" id="disc-detail" style="display:none">
        <div id="disc-safety"></div>
        <div class="dtabs" id="dtabs"></div>
        <div id="dsecs"></div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div class="vw" id="vw-settings">
      <div class="sec" style="padding-bottom:8px"><div class="stl" id="st-title"></div></div>
      <div class="slist" id="slist"></div>
    </div>
  </main>

  <nav class="nav" id="nav"></nav>
</div>

<!-- MODAL: Add/Edit Trip -->
<div class="ov" id="mo-trip">
  <div class="mo">
    <div class="mh"></div>
    <div class="mt" id="mo-trip-title"></div>
    <div class="fg"><label class="fl" id="lbl-dest"></label><input class="fi" id="trip-dest" type="text"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="fg"><label class="fl" id="lbl-from"></label><input class="fi" id="trip-from" type="date"></div>
      <div class="fg"><label class="fl" id="lbl-to"></label><input class="fi" id="trip-to" type="date"></div>
    </div>
    <div class="fg"><label class="fl" id="lbl-notes"></label><textarea class="fta" id="trip-notes"></textarea></div>
    <button class="btn btn-p btn-bl" onclick="saveTrip()" id="trip-save-btn"></button>
  </div>
</div>

<!-- MODAL: Add Document (Wallet) -->
<div class="ov" id="mo-doc">
  <div class="mo">
    <div class="mh"></div>
    <div class="mt" id="mo-doc-title"></div>
    <div class="fg"><label class="fl" id="lbl-doc-type"></label>
      <select class="fsl" id="doc-type">
        <option value="passport">🛂 Passport / 여권</option>
        <option value="flight">✈️ Flight / 항공권</option>
        <option value="hotel">🏨 Hotel / 호텔</option>
        <option value="car">🚗 Car Rental / 렌트카</option>
        <option value="insurance">🛡️ Insurance / 보험</option>
        <option value="visa">📋 Visa / 비자</option>
        <option value="other">📄 Other / 기타</option>
      </select>
    </div>
    <div class="fg"><label class="fl" id="lbl-doc-name"></label><input class="fi" id="doc-name" type="text"></div>
    <div class="fg"><label class="fl" id="lbl-doc-sub"></label><input class="fi" id="doc-sub" type="text"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="fg"><label class="fl" id="lbl-doc-valid"></label><input class="fi" id="doc-valid" type="date"></div>
      <div class="fg"><label class="fl" id="lbl-doc-link"></label><input class="fi" id="doc-link" type="url" placeholder="https://"></div>
    </div>
    <div class="fg">
      <label class="fl" id="lbl-doc-img"></label>
      <div class="fuz" id="fuz" onclick="triggerFile()">
        <div style="font-size:28px;margin-bottom:4px">📎</div>
        <div id="fuz-lbl"></div>
        <div style="font-size:11px;color:var(--mu2);margin-top:3px" id="fuz-sub"></div>
      </div>
      <img id="doc-img-prev" class="img-prev" style="display:none;margin-top:8px">
      <div id="ocr-res" style="display:none" class="ocr-badge">🔍 <span id="ocr-txt"></span></div>
      <input type="file" id="file-inp" accept="image/*,.pdf" style="display:none" onchange="handleFile(event)">
    </div>
    <div class="fg"><label class="fl" id="lbl-doc-notes"></label><textarea class="fta" id="doc-notes" style="min-height:60px"></textarea></div>
    <button class="btn btn-p btn-bl" onclick="saveDoc()" id="doc-save-btn"></button>
  </div>
</div>

<!-- MODAL: Add Journal Entry -->
<div class="ov" id="mo-jnl">
  <div class="mo">
    <div class="mh"></div>
    <div class="mt" id="mo-jnl-title"></div>
    <div class="fg"><label class="fl" id="lbl-jnl-mood">Mood</label>
      <div class="mood-row" id="mood-row">
        <button class="mood-btn" data-mood="😄" onclick="selectMood('😄')">😄</button>
        <button class="mood-btn" data-mood="😊" onclick="selectMood('😊')">😊</button>
        <button class="mood-btn" data-mood="😐" onclick="selectMood('😐')">😐</button>
        <button class="mood-btn" data-mood="😴" onclick="selectMood('😴')">😴</button>
        <button class="mood-btn" data-mood="🤩" onclick="selectMood('🤩')">🤩</button>
        <button class="mood-btn" data-mood="😰" onclick="selectMood('😰')">😰</button>
      </div>
    </div>
    <div class="fg"><label class="fl" id="lbl-jnl-title2"></label><input class="fi" id="jnl-title-inp" type="text"></div>
    <div class="fg"><label class="fl" id="lbl-jnl-body"></label><textarea class="fta" id="jnl-body" style="min-height:100px"></textarea></div>
    <div class="fg"><label class="fl" id="lbl-jnl-loc"></label><input class="fi" id="jnl-loc" type="text" placeholder="📍"></div>
    <div class="fg">
      <label class="fl" id="lbl-jnl-img">Photo</label>
      <div class="fuz" onclick="document.getElementById('jnl-file-inp').click()">
        <div style="font-size:24px;margin-bottom:4px">📷</div>
        <div id="jnl-fuz-lbl">Add photo</div>
      </div>
      <img id="jnl-img-prev" class="img-prev" style="display:none;margin-top:8px">
      <input type="file" id="jnl-file-inp" accept="image/*" style="display:none" onchange="handleJnlFile(event)">
    </div>
    <button class="btn btn-p btn-bl" onclick="saveJournal()" id="jnl-save-btn"></button>
  </div>
</div>

<!-- MODAL: Add Map Marker -->
<div class="ov" id="mo-mk">
  <div class="mo">
    <div class="mh"></div>
    <div class="mt" id="mo-mk-title"></div>
    <div class="fg"><label class="fl" id="lbl-mk-name">Place Name</label><input class="fi" id="mk-name" type="text"></div>
    <div class="fg"><label class="fl">Emoji / Icon</label><input class="fi" id="mk-icon" type="text" placeholder="📍" style="font-size:22px;width:80px" value="📍"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="fg"><label class="fl">Latitude</label><input class="fi" id="mk-lat" type="number" step="any" placeholder="35.6762"></div>
      <div class="fg"><label class="fl">Longitude</label><input class="fi" id="mk-lng" type="number" step="any" placeholder="139.6503"></div>
    </div>
    <div class="fg"><label class="fl">Note</label><textarea class="fta" id="mk-note" style="min-height:60px"></textarea></div>
    <button class="btn btn-p btn-bl" onclick="saveMarker()" id="mk-save-btn">Save</button>
  </div>
</div>

<!-- MODAL: Itinerary Day -->
<div class="ov" id="mo-itin">
  <div class="mo">
    <div class="mh"></div>
    <div class="mt" id="mo-itin-title">Day Planner</div>
    <div id="itin-days-form"></div>
    <button class="btn btn-p btn-bl" onclick="saveItin()" style="margin-top:12px">Save</button>
  </div>
</div>

<!-- MODAL: Add Checklist Item -->
<div class="ov" id="mo-cla">
  <div class="mo">
    <div class="mh"></div>
    <div class="mt" id="mo-cla-title"></div>
    <div class="fg"><label class="fl" id="lbl-cla-n"></label><input class="fi" id="cla-name" type="text"></div>
    <div class="fg"><label class="fl" id="lbl-cla-s"></label><textarea class="fta" id="cla-sub" style="min-height:60px"></textarea></div>
    <div class="fg"><label class="fl" id="lbl-cla-p"></label>
      <select class="fsl" id="cla-pri">
        <option value="1">🔴 P1 — 필수 / Critical</option>
        <option value="2">🟠 P2 — 중요 / Important</option>
        <option value="3">🟡 P3 — 보통 / Medium</option>
        <option value="4">🟢 P4 — 선택 / Optional</option>
      </select>
    </div>
    <div class="fg"><label class="fl" id="lbl-cla-ic"></label><input class="fi" id="cla-icon" type="text" placeholder="✈️" style="font-size:22px;width:80px"></div>
    <div class="fg"><label class="fl" id="lbl-cla-lk"></label><input class="fi" id="cla-link1" type="url" placeholder="https://..."></div>
    <button class="btn btn-p btn-bl" onclick="saveCheckItem()" id="cla-save-btn"></button>
  </div>
</div>

<div id="toast" class="toast"></div>

// Haversine distance in km
function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function estimateTaxi(countryCode,destLat,destLng){
  const rate=TAXI_RATES[countryCode];
  if(!rate||!destLat){return;}
  if(!navigator.geolocation){alert('위치 서비스를 지원하지 않습니다.');return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const km=haversineKm(pos.coords.latitude,pos.coords.longitude,destLat,destLng);
    const fare=rate.base+km*rate.perKm;
    const fareStr=fare>=1000?fare.toLocaleString():(Math.round(fare*10)/10).toString();
    const msg={
      ko:`📍 현재 위치 → 목적지\n거리: ${km.toFixed(1)}km\n🚕 예상 택시 요금: ${rate.sym}${fareStr}\n(${rate.note.ko})`,
      en:`📍 Your location → Destination\nDistance: ${km.toFixed(1)}km\n🚕 Estimated taxi: ${rate.sym}${fareStr}\n(${rate.note.en})`,
      ja:`📍 現在地 → 目的地\n距離: ${km.toFixed(1)}km\n🚕 タクシー概算: ${rate.sym}${fareStr}\n(${rate.note.ja})`,
      zh:`📍 当前位置 → 目的地\n距离: ${km.toFixed(1)}km\n🚕 打车估价: ${rate.sym}${fareStr}\n(${rate.note.zh})`
    };
    alert(msg[S.lang]||msg.en);
  },err=>{

function speakTTS(text,countryCode){
  if(!window.speechSynthesis){alert('TTS를 지원하지 않는 브라우저입니다.');return;}
  const lang=TTS_LANG[countryCode]||'en-US';
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang=lang;utt.rate=0.9;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utt);
}

    // Always refresh icon/structure from CL_DEFAULT; only keep user state (done/notes/userLinks)
    {const savedMap={};(S.checklist||[]).forEach(x=>{if(x.id)savedMap[x.id]={done:x.done||false,notes:x.notes||'',userLinks:x.userLinks||[]};});
    S.checklist=CL_DEFAULT.map(x=>({...x,done:savedMap[x.id]?.done||false,notes:savedMap[x.id]?.notes||'',userLinks:savedMap[x.id]?.userLinks||[]}));}

function navigate(v){
  S.view=v;
  document.querySelectorAll('.vw').forEach(el=>el.classList.remove('on'));
  document.getElementById('vw-'+v).classList.add('on');
  document.querySelectorAll('.nb').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(el=>{if(el.dataset.v===v)el.classList.add('on');});
  renderView(v);
}

function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=NAVS.map(n=>`<button class="nb${S.view===n.v?' on':''}" data-v="${n.v}" onclick="navigate('${n.v}')"><span class="ni">${n.icon}</span><span>${t(n.tk)}</span></button>`).join('');
}

function renderView(v){
  renderNav();
  if(v==='home')renderHome();
  else if(v==='checklist')renderChecklist();

  else if(v==='discover')renderDiscover();
  else if(v==='settings')renderSettings();
  else if(v==='map')renderMap();
  else if(v==='journal')renderJournal();
}

// Weather via Open-Meteo (free, no key required)
async function fetchWeatherForTrip(){
  if(!S.trip||!S.trip.dest)return;
  // Try to match destination to a country
  const matched=COUNTRIES.find(c=>S.trip.dest.toLowerCase().includes(c.n.en.toLowerCase())||S.trip.dest.toLowerCase().includes(c.n.ko)||S.trip.dest.toLowerCase().includes(c.n.ja)||S.trip.dest.toLowerCase().includes(c.n.zh));
  const coords=matched?CAPITALS[matched.c]:null;
  if(!coords)return;
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords[0]}&longitude=${coords[1]}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&forecast_days=5&timezone=auto`);
    const d=await r.json();
    S.weather=d;S.wxCountry=S.trip.dest;
    saveState();
    // Re-render weather widget only
    const wxEl=document.getElementById('wx-widget');
    if(wxEl&&S.view==='home'){
      wxEl.style.display='block';
      document.getElementById('wx-ic').textContent=WX_ICONS[d.current?.weather_code]||'🌡️';
      document.getElementById('wx-temp').textContent=(d.current?.temperature_2m??'--')+'°C';
      document.getElementById('wx-desc').textContent=S.trip.dest;
      if(d.daily){
        document.getElementById('wx-forecast').innerHTML=d.daily.time.slice(0,5).map((dt,i)=>{
          const day=new Date(dt);
          return `<div class="wx-day"><div>${WX_DN[day.getDay()]}</div><div class="wx-day-ic">${WX_ICONS[d.daily.weather_code[i]]||'⛅'}</div><div class="wx-day-t">${Math.round(d.daily.temperature_2m_max[i])}°</div></div>`;
        }).join('');
      }
    }
  }catch(e){}
}

  document.getElementById('pk-cat-row').innerHTML=CAT_DEF.map(c=>`<button class="pc${S.clCat===c.k?' on':''}" onclick="setClCat('${c.k}')">${c.ic} ${t('cat_'+c.k)}</button>`).join('');

  // Filters
  document.getElementById('cl-filters').innerHTML=[
    {k:'all',lk:'all'},{k:'todo',lk:'todo'},{k:'done',lk:'done_f'},
    {k:'p1',lk:'p_critical'},{k:'p2',lk:'p_important'}
  ].map(f=>`<div class="fc${S.clFilter===f.k?' on':''}" onclick="setFilter('${f.k}')">${t(f.lk)}</div>`).join('');

  // Category filter sets
  const CAT_IDS={docs:['passport','visa','flight','hotel','insurance'],clothes:['luggage'],tech:['sim'],health:['emergency'],misc:['transport','currency']};

  // List
  let items=[...S.checklist].sort((a,b)=>a.p-b.p);
  if(S.clCat!=='all'){
    const catIds=CAT_IDS[S.clCat]||[];
    items=items.filter(x=>catIds.includes(x.id)||x.clCat===S.clCat);
  }
  if(S.clFilter==='todo')items=items.filter(x=>!x.done);
  else if(S.clFilter==='done')items=items.filter(x=>x.done);
  else if(S.clFilter==='p1')items=items.filter(x=>x.p===1);
  else if(S.clFilter==='p2')items=items.filter(x=>x.p===2);

  const pLabels={1:'p1',2:'p2',3:'p3',4:'p4'};
  const pTexts={1:{ko:'필수',en:'Critical',ja:'必須',zh:'必须'},2:{ko:'중요',en:'Important',ja:'重要',zh:'重要'},3:{ko:'보통',en:'Medium',ja:'普通',zh:'普通'},4:{ko:'선택',en:'Optional',ja:'任意',zh:'可选'}};

  document.getElementById('cl-list').innerHTML=items.map(item=>{
    const name=item.customName||(item.tk?t(item.tk):item.id);
    const sub=item.customSub||(item.sk?t(item.sk):'');
    const allLinks=[...(item.links||[]),...(item.userLinks||[])];
    return `<div class="ci${item.done?' done':''}" id="ci-${item.id}">
      <div class="ci-m">
        <div class="chk${item.done?' on':''}" onclick="toggleItem('${item.id}')"></div>
        <span class="ci-ic">${item.icon||'📌'}</span>
        <div class="ci-body">
          <div class="ci-top">
            <span class="ci-t">${name}</span>
            <span class="bdg ${pLabels[item.p]||'p4'}">${(pTexts[item.p]||{})[S.lang]||'P'+item.p}</span>
          </div>
          ${sub?`<div class="ci-s">${sub}</div>`:''}
          ${item.notes?`<div style="font-size:11px;color:var(--ok);margin-top:3px">📝 ${item.notes}</div>`:''}
        </div>
      </div>
      ${allLinks.length?`<div class="ci-links">${allLinks.map(l=>`<a class="cl" href="${l.u}" target="_blank" rel="noopener">🔗 ${l.l}</a>`).join('')}</div>`:''}
    </div>`;
  }).join('');

  if(!items.length){
    document.getElementById('cl-list').innerHTML=`<div class="empty"><div class="empty-ic">✅</div><div class="empty-t">${t('done_f')}!</div><div class="empty-s">${t('completed_txt')}</div></div>`;
  }
}

  document.getElementById('cpicker-wrap').innerHTML=`

        :`<span class="cpicker-flag">🌍</span><span class="cpicker-placeholder">${placeholder}</span>`

function togglePicker(){
  _pickerOpen=!_pickerOpen;
  const btn=document.getElementById('cpicker-btn');
  const list=document.getElementById('cpicker-list');
  if(btn)btn.classList.toggle('open',_pickerOpen);
  if(list)list.classList.toggle('open',_pickerOpen);
}

function selectCountry(c){
  S.discountry=c;S.discTab=0;_pickerOpen=false;
  // Track as visited
  if(!S.visitedCountries.includes(c)){S.visitedCountries.push(c);saveState();}
  // Fetch weather for selected country capital
  const coords=CAPITALS[c];
  if(coords){
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords[0]}&longitude=${coords[1]}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&forecast_days=5&timezone=auto`)
      .then(r=>r.json()).then(d=>{S.weather=d;saveState();}).catch(()=>{});
  }
  renderDiscover();
  setTimeout(()=>{const dd=document.getElementById('disc-detail');if(dd)dd.scrollIntoView({behavior:'smooth',block:'start'});},150);
}

// MAP VIEW (Leaflet)
// ============================================
let _map=null,_mapLayer=null,_myLocMarker=null,_myLat=null,_myLng=null;

function showMyLocation(){
  if(!navigator.geolocation){
    showToast({ko:'위치 서비스를 지원하지 않습니다',en:'Geolocation not supported',ja:'位置情報非対応',zh:'不支持定位'}[S.lang]||'Not supported');
    return;
  }
  showToast({ko:'📍 위치 확인 중...',en:'📍 Getting location...',ja:'📍 位置取得中...',zh:'📍 获取位置中...'}[S.lang]||'Getting location...');
  navigator.geolocation.getCurrentPosition(pos=>{
    _myLat=pos.coords.latitude;
    _myLng=pos.coords.longitude;
    if(!_map)return;
    if(_myLocMarker)_map.removeLayer(_myLocMarker);
    const myIc=L.divIcon({html:`<div style="width:16px;height:16px;background:#2563EB;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 4px rgba(37,99,235,0.3)"></div>`,className:'',iconSize:[16,16],iconAnchor:[8,8]});
    _myLocMarker=L.marker([_myLat,_myLng],{icon:myIc}).addTo(_map);
    _myLocMarker.bindPopup({ko:'📍 내 현재 위치',en:'📍 My Location',ja:'📍 現在地',zh:'📍 我的位置'}[S.lang]||'My Location').openPopup();
    _map.setView([_myLat,_myLng],13);
    renderMapMarkerList();
  },()=>{
    showToast({ko:'⚠️ 위치 권한을 허용해주세요',en:'⚠️ Allow location permission',ja:'⚠️ 位置情報を許可してください',zh:'⚠️ 请允许位置权限'}[S.lang]||'Allow location');
  },{enableHighAccuracy:true,timeout:10000});
}

function renderMapMarkerList(){
  const ml=document.getElementById('map-markers-list');
  if(!ml)return;
  if(S.mapView==='itinerary'){renderItinerary(ml);return;}
  if(S.mapMarkers.length===0){
    ml.innerHTML=`<div class="empty"><div class="empty-ic">🗺️</div><div class="empty-t">${t('map_empty')}</div></div>`;
    return;
  }
  ml.innerHTML=S.mapMarkers.map((mk,i)=>{
    let distHtml='';
    if(_myLat!==null){
      const km=haversineKm(_myLat,_myLng,mk.lat,mk.lng);
      const walkMin=Math.round(km/5*60);
      const driveMin=Math.round(km/40*60);
      const distLabel=km<1?`${Math.round(km*1000)}m`:`${km.toFixed(1)}km`;
      distHtml=`<div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap">
        <span style="font-size:11px;color:var(--pri);font-weight:600">📏 ${distLabel}</span>
        <span style="font-size:11px;color:var(--mu)">🚶 ${walkMin}분</span>
        <span style="font-size:11px;color:var(--mu)">🚗 ${driveMin}분</span>
        <a href="https://www.google.com/maps/dir/?api=1&origin=${_myLat},${_myLng}&destination=${mk.lat},${mk.lng}" target="_blank"
          style="font-size:11px;color:var(--acc);font-weight:600;text-decoration:none" onclick="event.stopPropagation()">🗺️ Google Maps</a>
      </div>`;
    }
    return `<div class="mk" onclick="flyToMarker(${i})">
      <div class="mk-ic">${mk.icon||'📍'}</div>
      <div class="mk-body">
        <div class="mk-name">${mk.name}</div>
        <div class="mk-coord">${mk.lat.toFixed(4)}, ${mk.lng.toFixed(4)}</div>
        ${mk.note?`<div style="font-size:12px;color:var(--mu);margin-top:2px">${mk.note}</div>`:''}
        ${distHtml}
      </div>
      <button class="mk-del" onclick="event.stopPropagation();deleteMarker(${i})">🗑️</button>
    </div>`;
  }).join('');
}

function renderMap(){
  document.getElementById('map-toolbar').innerHTML=[
    {k:'markers',lk:'map_markers'},{k:'route',lk:'map_route'},{k:'itinerary',lk:'map_itinerary'}
  ].map(b=>`<button class="mtb${S.mapView===b.k?' on':''}" onclick="setMapView('${b.k}')">${t(b.lk)}</button>`).join('')
  +`<button class="mtb" onclick="showMyLocation()" title="내 위치">📍 ${({ko:'내 위치',en:'My Loc',ja:'現在地',zh:'我的位置'})[S.lang]||'My Loc'}</button>`
  +`<button class="mtb" onclick="openAddMarker()" style="margin-left:auto">＋ ${t('map_add_marker').replace('+ ','')}</button>`;

  // Init map once
  const mc=document.getElementById('map-container');
  if(!_map){
    _map=L.map('map-container',{zoomControl:true}).setView([20,0],2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'© <a href="https://www.openstreetmap.org">OpenStreetMap</a>',maxZoom:19
    }).addTo(_map);
    // Click to get coords
    _map.on('click',function(e){
      document.getElementById('mk-lat').value=e.latlng.lat.toFixed(5);
      document.getElementById('mk-lng').value=e.latlng.lng.toFixed(5);
    });
  }
  setTimeout(()=>_map.invalidateSize(),50);

  // Clear existing layers
  if(_mapLayer){_map.removeLayer(_mapLayer);}
  _mapLayer=L.layerGroup().addTo(_map);

  S.mapMarkers.forEach((mk,i)=>{
    const ic=L.divIcon({html:`<div style="font-size:24px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))">${mk.icon||'📍'}</div>`,className:'',iconSize:[30,30],iconAnchor:[15,30]});
    const m=L.marker([mk.lat,mk.lng],{icon:ic}).addTo(_mapLayer);
    m.bindPopup(`<b>${mk.name}</b>${mk.note?'<br><small>'+mk.note+'</small>':''}`);
  });

  // Draw route if markers > 1 and in route view
  if(S.mapView==='route'&&S.mapMarkers.length>1){
    const pts=S.mapMarkers.map(mk=>[mk.lat,mk.lng]);
    L.polyline(pts,{color:'#2563EB',weight:3,opacity:0.7,dashArray:'6,4'}).addTo(_mapLayer);
    // Fit bounds
    _map.fitBounds(pts,{padding:[30,30]});
  } else if(S.mapMarkers.length>0){
    const pts=S.mapMarkers.map(mk=>[mk.lat,mk.lng]);
    _map.fitBounds(pts,{padding:[40,40]});
  }

  // Markers list
  renderMapMarkerList();
}

  document.getElementById('ocr-res').style.display='none';
  document.getElementById('mo-doc').classList.add('open');
}

function triggerFile(){document.getElementById('file-inp').click();}

function handleFile(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    _pendingImg=ev.target.result;
    const prev=document.getElementById('doc-img-prev');
    if(file.type.startsWith('image/')){
      prev.src=_pendingImg;prev.style.display='block';
      // Mock OCR
      setTimeout(()=>{
        document.getElementById('ocr-res').style.display='flex';
        document.getElementById('ocr-txt').textContent=t('ocr_done');
        if(!document.getElementById('doc-name').value&&file.name){
          document.getElementById('doc-name').value=file.name.replace(/\.[^.]+$/,'');
        }
      },800);
    } else {
      prev.style.display='none';
      document.getElementById('ocr-res').style.display='flex';
      document.getElementById('ocr-txt').textContent='PDF '+t('ocr_done');
    }
  };
  reader.readAsDataURL(file);
}

function saveDoc(){
  const doc={
    type:document.getElementById('doc-type').value,
    name:document.getElementById('doc-name').value||t('type_other'),
    sub:document.getElementById('doc-sub').value,
    valid:document.getElementById('doc-valid').value,
    link:document.getElementById('doc-link').value,
    notes:document.getElementById('doc-notes').value,
    img:_pendingImg,
    added:new Date().toISOString()
  };
  if(_editDocIdx>=0)S.docs[_editDocIdx]=doc;
  else S.docs.unshift(doc);
  saveState();
  document.getElementById('mo-doc').classList.remove('open');
  _pendingImg=null;
  if(S.view==='wallet')renderWallet();
  else navigate('wallet');
  showToast('💳 '+t('save'));
}

function deleteDoc(i){
  if(confirm(t('delete')+'?')){
    S.docs.splice(i,1);saveState();renderWallet();
    showToast('🗑️ '+t('delete'));

}
