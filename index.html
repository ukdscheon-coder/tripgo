<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulting App</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babel-standalone@7.22.9/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.4.0/dist/axios.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const App = () => {
      const [users, setUsers] = useState([]);
      const [projects, setProjects] = useState([]);
      const [consultings, setConsultings] = useState([]);
      const [newUser, setNewUser] = useState({
        name: '',
        educationLevel: '',
        workExperience: '',
        skills: ''
      });

      useEffect(() => {
        fetchData();
      }, []);

      const fetchData = async () => {
        try {
          const [usersRes, projectsRes, consultingsRes] = await Promise.all([
            axios.get('http://localhost:3000/api/users'),
            axios.get('http://localhost:3000/api/microprojects'),
            axios.get('http://localhost:3000/api/consultings')
          ]);
          setUsers(usersRes.data);
          setProjects(projectsRes.data);
          setConsultings(consultingsRes.data);
        } catch (error) {
          console.error('Error fetching data:', error);
        }
      };

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setNewUser({ ...newUser, [name]: value });
      };

      const registerUser = async () => {
        try {
          await axios.post('http://localhost:3000/api/users', {
            ...newUser,
            workExperience: parseInt(newUser.workExperience),
            skills: newUser.skills.split(',').map(skill => skill.trim())
          });
          setNewUser({ name: '', educationLevel: '', workExperience: '', skills: '' });
          fetchData();
          alert('User registered successfully!');
        } catch (error) {
          console.error('Error registering user:', error);
          alert('Failed to register user.');
        }
      };

      const applyForProject = async (projectId) => {
        try {
          await axios.post('http://localhost:3000/api/microprojects/apply', { projectId });
          fetchData();
          alert('Applied for project successfully!');
        } catch (error) {
          console.error('Error applying for project:', error);
          alert('Failed to apply for project.');
        }
      };

      const applyForConsulting = async (consultingId) => {
        try {
          await axios.post('http://localhost:3000/api/consultings/apply', { consultingId });
          fetchData();
          alert('Applied for consulting successfully!');
        } catch (error) {
          console.error('Error applying for consulting:', error);
          alert('Failed to apply for consulting.');
        }
      };

      return (
        <div className="container mx-auto p-4">
          <h1 className="text-2xl font-bold mb-4">Consulting Platform</h1>
          
          {/* User Registration */}
          <div className="mb-8">
            <h2 className="text-xl font-semibold mb-2">Register User</h2>
            <div className="grid grid-cols-2 gap-4">
              <input
                type="text"
                name="name"
                value={newUser.name}
                onChange={handleInputChange}
                placeholder="Name"
                className="border p-2 rounded"
              />
              <input
                type="text"
                name="educationLevel"
                value={newUser.educationLevel}
                onChange={handleInputChange}
                placeholder="Education Level"
                className="border p-2 rounded"
              />
              <input
                type="number"
                name="workExperience"
                value={newUser.workExperience}
                onChange={handleInputChange}
                placeholder="Work Experience (years)"
                className="border p-2 rounded"
              />
              <input
                type="text"
                name="skills"
                value={newUser.skills}
                onChange={handleInputChange}
                placeholder="Skills (comma-separated)"
                className="border p-2 rounded"
              />
            </div>
            <button
              onClick={registerUser}
              className="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
            >
              Register
            </button>
          </div>

          {/* Users List */}
          <div className="mb-8">
            <h2 className="text-xl font-semibold mb-2">Users</h2>
            <div className="grid grid-cols-1 gap-4">
              {users.map(user => (
                <div key={user._id} className="border p-4 rounded">
                  <p><strong>Name:</strong> {user.name}</p>
                  <p><strong>Rating:</strong> {user.rating}</p>
                  <p><strong>Education:</strong> {user.educationLevel}</p>
                  <p><strong>Experience:</strong> {user.workExperience} years</p>
                  <p><strong>Skills:</strong> {user.skills.join(', ')}</p>
                </div>
              ))}
            </div>
          </div>

          {/* Micro Projects List */}
          <div className="mb-8">
            <h2 className="text-xl font-semibold mb-2">Micro Projects</h2>
            <div className="grid grid-cols-1 gap-4">
              {projects.map(project => (
                <div key={project._id} className="border p-4 rounded">
                  <p><strong>Title:</strong> {project.title}</p>
                  <p><strong>Description:</strong> {project.description}</p>
                  <p><strong>Required Rating:</strong> {project.requiredRating}</p>
                  <p><strong>Status:</strong> {project.status}</p>
                  <button
                    onClick={() => applyForProject(project._id)}
                    className="mt-2 bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
                  >
                    Apply
                  </button>
                </div>
              ))}
            </div>
          </div>

          {/* Consulting List */}
          <div>
            <h2 className="text-xl font-semibold mb-2">Consulting Opportunities</h2>
            <div className="grid grid-cols-1 gap-4">
              {consultings.map(consulting => (
                <div key={consulting._id} className="border p-4 rounded">
                  <p><strong>Title:</strong> {consulting.title}</p>
                  <p><strong>Category:</strong> {consulting.category}</p>
                  <p><strong>Required Rating:</strong> {consulting.requiredRating}</p>
                  <p><strong>Status:</strong> {consulting.status}</p>
                  <button
                    onClick={() => applyForConsulting(consulting._id)}
                    className="mt-2 bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600"
                  >
                    Apply
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
